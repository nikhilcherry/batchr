[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchr"
version = "0.1.0"
description = "Content-hash cached, crash-safe parallel batch runner — make for functions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
batchr = "batchr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
